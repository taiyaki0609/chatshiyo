<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>チャッツイヨ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    #chatArea {
      display: none;
    }

    #messages {
      height: 400px;
      overflow-y: auto;
      background: #f7f7f7;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .message {
      background: white;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .system {
      color: #777;
      text-align: center;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .send-area {
      display: flex;
      gap: 10px;
    }

    .send-area input {
      margin: 0;
      flex: 1;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💬 チャッツイヨ</h1>

    <!-- 入室画面 -->
    <div id="loginArea" class="card">

      <h2>チャットに入る</h2>

      <input
        type="text"
        id="username"
        placeholder="ユーザー名"
        maxlength="20"
      >

      <input
        type="text"
        id="room"
        placeholder="ルーム名"
        maxlength="30"
      >

      <button onclick="joinRoom()">入室する</button>

    </div>


    <!-- チャット画面 -->
    <div id="chatArea" class="card">

      <h2 id="roomTitle"></h2>

      <div id="messages"></div>

      <div class="send-area">

        <input
          type="text"
          id="messageInput"
          placeholder="メッセージを入力"
          maxlength="500"
        >

        <button onclick="sendMessage()">送信</button>

      </div>

    </div>

  </div>


  <script src="/socket.io/socket.io.js"></script>

  <script>

    const socket = io();

    const loginArea = document.getElementById("loginArea");
    const chatArea = document.getElementById("chatArea");

    const usernameInput = document.getElementById("username");
    const roomInput = document.getElementById("room");
    const messageInput = document.getElementById("messageInput");

    const messages = document.getElementById("messages");
    const roomTitle = document.getElementById("roomTitle");


    function joinRoom() {

      const username = usernameInput.value.trim();
      const room = roomInput.value.trim();

      if (!username || !room) {
        alert("ユーザー名とルーム名を入力してください");
        return;
      }

      socket.emit("joinRoom", {
        username: username,
        room: room
      });

      loginArea.style.display = "none";
      chatArea.style.display = "block";

      roomTitle.textContent = "ルーム： " + room;

      messageInput.focus();
    }


    function sendMessage() {

      const message = messageInput.value.trim();

      if (!message) return;

      socket.emit("chatMessage", message);

      messageInput.value = "";
      messageInput.focus();
    }


    socket.on("chatMessage", (data) => {

      const div = document.createElement("div");

      div.className = "message";

      div.textContent = data.username + "： " + data.message;

      messages.appendChild(div);

      messages.scrollTop = messages.scrollHeight;
    });


    socket.on("systemMessage", (data) => {

      const div = document.createElement("div");

      div.className = "system";

      div.textContent = data.message;

      messages.appendChild(div);

      messages.scrollTop = messages.scrollHeight;
    });


    messageInput.addEventListener("keydown", (event) => {

      if (event.key === "Enter") {
        sendMessage();
      }

    });

  </script>

</body>
</html>
