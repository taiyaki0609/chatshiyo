<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>チャット</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    #chatArea {
      display: none;
    }

    #messages {
      height: 350px;
      overflow-y: auto;
      background: #f7f7f7;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .message {
      margin-bottom: 10px;
      padding: 8px 10px;
      background: white;
      border-radius: 8px;
    }

    .system {
      color: #777;
      font-size: 14px;
      text-align: center;
      margin: 8px;
    }

    #messageInput {
      width: 75%;
      display: inline-block;
    }

    #sendButton {
      width: 23%;
      display: inline-block;
      margin-left: 1%;
    }

    #error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }

    #roomInfo {
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>チャットしよ</h1>

  <!-- ルーム選択画面 -->
  <div id="roomArea">

    <!-- ユーザー名 -->
    <div class="card">
      <h2>ユーザー名</h2>

      <input
        id="username"
        type="text"
        placeholder="あなたの名前"
      >
    </div>

    <!-- ルームを作る -->
    <div class="card">
      <h2>ルームを作る</h2>

      <input
        id="createRoomName"
        type="text"
        placeholder="新しいルーム名"
      >

      <button onclick="createRoom()">
        ルームを作る
      </button>
    </div>

    <!-- ルームに入る -->
    <div class="card">
      <h2>ルームに入る</h2>

      <input
        id="joinRoomName"
        type="text"
        placeholder="入りたいルーム名"
      >

      <button onclick="joinRoom()">
        このルームに入る
      </button>
    </div>

    <div id="error"></div>

  </div>


  <!-- チャット画面 -->
  <div id="chatArea">

    <div class="card">

      <div id="roomInfo"></div>

      <div id="messages"></div>

      <div>
        <input
          id="messageInput"
          type="text"
          placeholder="メッセージを入力"
        >

        <button id="sendButton">
          送信
        </button>
      </div>

    </div>

  </div>

</div>


<!-- Socket.IO -->
<script src="/socket.io/socket.io.js"></script>

<script>

  const socket = io();

  let username = "";
  let currentRoom = "";


  // ルームを作る
  function createRoom() {

    username = document.getElementById("username").value.trim();

    const room =
      document.getElementById("createRoomName").value.trim();

    if (!username) {
      showError("ユーザー名を入力してください");
      return;
    }

    if (!room) {
      showError("ルーム名を入力してください");
      return;
    }

    socket.emit("createRoom", room);

    currentRoom = room;
  }


  // ルーム作成成功
  socket.on("roomCreated", (room) => {

    joinCreatedRoom(room);

  });


  // 作ったルームに入る
  function joinCreatedRoom(room) {

    socket.emit("joinRoom", {
      username: username,
      room: room
    });

  }


  // 既存のルームに入る
  function joinRoom() {

    username = document.getElementById("username").value.trim();

    const room =
      document.getElementById("joinRoomName").value.trim();

    if (!username) {
      showError("ユーザー名を入力してください");
      return;
    }

    if (!room) {
      showError("ルーム名を入力してください");
      return;
    }

    currentRoom = room;

    socket.emit("joinRoom", {
      username: username,
      room: room
    });

  }


  // 入室成功
  socket.on("systemMessage", (data) => {

    addSystemMessage(data.message);

    if (
      data.message === currentRoom + " に入りました"
    ) {
      document.getElementById("roomArea").style.display = "none";

      document.getElementById("chatArea").style.display = "block";

      document.getElementById("roomInfo").textContent =
        "ルーム：" + currentRoom;
    }

  });


  // チャットメッセージ
  socket.on("chatMessage", (data) => {

    addMessage(
      data.username,
      data.message
    );

  });


  // メッセージを表示
  function addMessage(name, message) {

    const messages =
      document.getElementById("messages");

    const div =
      document.createElement("div");

    div.className = "message";

    div.textContent =
      name + "： " + message;

    messages.appendChild(div);

    messages.scrollTop =
      messages.scrollHeight;
  }


  // システムメッセージ
  function addSystemMessage(message) {

    const messages =
      document.getElementById("messages");

    const div =
      document.createElement("div");

    div.className = "system";

    div.textContent = message;

    messages.appendChild(div);

    messages.scrollTop =
      messages.scrollHeight;
  }


  // エラー表示
  socket.on("roomError", (message) => {

    showError(message);

  });


  function showError(message) {

    document.getElementById("error").textContent =
      message;

  }


  // 送信
  document
    .getElementById("sendButton")
    .addEventListener("click", sendMessage);


  // Enterでも送信
  document
    .getElementById("messageInput")
    .addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    });


  function sendMessage() {

    const input =
      document.getElementById("messageInput");

    const message =
      input.value.trim();

    if (!message) return;

    socket.emit("chatMessage", message);

    input.value = "";

  }

</script>

</body>
</html>
