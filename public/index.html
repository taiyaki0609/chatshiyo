<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>チャッツイヨ</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;

      background: #f2f4f7;

      color: #222;

    }


    .container {

      max-width: 700px;

      margin: 40px auto;

      padding: 20px;

    }


    h1 {

      text-align: center;

      margin-bottom: 30px;

    }


    .card {

      background: white;

      padding: 25px;

      border-radius: 15px;

      margin-bottom: 20px;

      box-shadow:
        0 3px 10px
        rgba(0, 0, 0, 0.08);

    }


    input {

      width: 100%;

      padding: 13px;

      margin: 8px 0;

      border:
        1px solid #ccc;

      border-radius: 8px;

      font-size: 16px;

    }


    button {

      width: 100%;

      padding: 13px;

      margin-top: 10px;

      border: none;

      border-radius: 8px;

      background: #333;

      color: white;

      font-size: 16px;

      cursor: pointer;

    }


    button:hover {

      background: #555;

    }


    .backButton {

      background: #888;

    }


    .backButton:hover {

      background: #666;

    }


    .room {

      background: #f8f8f8;

      border:
        1px solid #ddd;

      border-radius: 12px;

      padding: 18px;

      margin-bottom: 15px;

    }


    .roomName {

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 8px;

    }


    .deleteRoomButton {
      background: #b42318;
    }

    .deleteRoomButton:hover {
      background: #8f1b13;
    }

    .roomCount {

      color: #666;

      margin-bottom: 10px;

    }


    .users {

      padding-left: 10px;

      color: #555;

    }


    .users div {

      margin: 4px 0;

    }


    .error {

      color: red;

      text-align: center;

      margin: 10px 0;

    }


    #nameArea,
    #menuArea,
    #createArea,
    #roomsArea,
    #chatArea {

      display: none;

    }


    #nameArea {

      display: block;

    }


    #messages {

      height: 350px;

      overflow-y: auto;

      background: #f7f7f7;

      padding: 15px;

      border-radius: 10px;

      margin-bottom: 10px;

    }


    .message {

      margin-bottom: 10px;

      padding: 9px 11px;

      background: white;

      border-radius: 8px;

    }


    .system {

      color: #777;

      font-size: 14px;

      text-align: center;

      margin: 8px;

    }


    #messageInput {

      width: 75%;

      display: inline-block;

    }


    #sendButton {

      width: 23%;

      display: inline-block;

      margin-left: 1%;

    }


    #roomTitle {

      text-align: center;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    .empty {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    #roomSettingsPanel {
      display: none;
      margin: 12px 0;
      padding: 16px;
      background: #f4f6fb;
      border: 1px solid #dce2ec;
      border-radius: 12px;
    }

    #roomSettingsPanel label { display: block; margin: 12px 0; }
    #roomSettingsPanel input[type="checkbox"] { width: auto; margin-right: 8px; }
    #roomSettingsPanel select {
      width: 100%; padding: 10px; border: 1px solid #ccc;
      border-radius: 8px; font-size: 16px;
    }
    .roomLock { color: #9a6a00; font-size: 13px; margin-top: 5px; }

    #moderationVoteBoard {
      margin: 14px 0;
      padding: 14px;
      background: #f1f5ff;
      border: 1px solid #cbd8f3;
      border-radius: 12px;
    }
    #moderationVoteBoard h3 { margin: 0 0 10px; }
    #moderationVoteComposer {
      display: none;
      margin: 10px 0;
      padding: 12px;
      background: #fff;
      border-radius: 10px;
    }
    #moderationVoteComposer input { width: 100%; }
    .voteChoiceButton { margin-top: 8px; }
    .voteCounts { margin: 10px 0; line-height: 1.8; }
    .voteNotice { color: #555; font-size: 14px; margin-top: 8px; }

    #announcementBoard {
      margin: 14px 0;
      padding: 14px;
      background: #fffaf0;
      border: 1px solid #f0d99b;
      border-radius: 12px;
    }
    #announcementBoard h3 { margin: 0 0 10px; }
    #announcementComposer {
      display: none;
      margin: 12px 0;
      padding: 12px;
      background: #f4f6fb;
      border-radius: 10px;
    }
    #announcementText {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      box-sizing: border-box;
    }
    .announcementCard {
      padding: 11px;
      margin: 9px 0;
      background: white;
      border: 1px solid #eadfca;
      border-radius: 9px;
      overflow-wrap: anywhere;
    }
    .announcementMeta { color: #777; font-size: 12px; margin-bottom: 7px; }
    .announcementBody { white-space: pre-wrap; }
    .announcementActions { display: flex; gap: 7px; margin-top: 8px; }
    .announcementActions button { width: auto; margin: 0; padding: 7px 11px; }
    #roomPresence { margin: 8px 0 14px; padding: 9px 11px; background: #f4f6fb; border-radius: 9px; font-size: 13px; color: #555; }
    .presenceUser { display: inline-block; margin: 3px 9px 3px 0; }
    .message { overflow-wrap: anywhere; }
    .messageReply { padding: 6px 8px; margin-bottom: 7px; background: #f0f2f5; border-left: 3px solid #8294b8; border-radius: 5px; color: #555; font-size: 13px; }
    .messageText { white-space: pre-wrap; }
    .messageTools { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 5px; color: #888; font-size: 12px; }
    .messageTools button { width: auto; margin: 0; padding: 4px 9px; font-size: 12px; background: #e8edf5; color: #334; }
    .messageTools button:hover { background: #dbe3ef; }
    #replyBar { display: none; margin: 8px 0; padding: 9px 11px; background: #eef3ff; border-radius: 8px; font-size: 13px; }
    #replyBar button { width: auto; margin: 0 0 0 8px; padding: 4px 8px; font-size: 12px; }

  </style>

</head>


<body>


<div class="container">


  <h1>💬 チャッツイヨ</h1>


  <!-- ================= -->
  <!-- ユーザー名 -->
  <!-- ================= -->

  <div id="nameArea">

    <div class="card">

      <h2>ユーザー名を入力</h2>

      <input
        id="username"
        type="text"
        maxlength="20"
        placeholder="例：たい焼き"
      >

      <button onclick="setUsername()">
        次へ
      </button>

      <div
        id="nameError"
        class="error"
      ></div>

    </div>

  </div>


  <!-- ================= -->
  <!-- メニュー -->
  <!-- ================= -->

  <div id="menuArea">

    <div class="card">

      <h2 id="welcome"></h2>

      <button onclick="showCreate()">
        ＋ ルームを作る
      </button>

      <button onclick="showRooms()">
        🔍 ルームを探す
      </button>

      <button id="notificationPermissionButton" type="button" onclick="enableNotifications()">
        🔔 通知を有効にする
      </button>
      <div id="notificationStatus" class="error"></div>

    </div>

  </div>


  <!-- ================= -->
  <!-- ルーム作成 -->
  <!-- ================= -->

  <div id="createArea">

    <div class="card">

      <h2>ルームを作る</h2>

      <input
        id="createRoomName"
        type="text"
        maxlength="30"
        placeholder="ルーム名"
      >

      <button onclick="createRoom()">
        作成する
      </button>

      <button
        class="backButton"
        onclick="showMenu()"
      >
        戻る
      </button>

      <div
        id="createError"
        class="error"
      ></div>

    </div>

  </div>


  <!-- ================= -->
  <!-- ルーム一覧 -->
  <!-- ================= -->

  <div id="roomsArea">

    <div class="card">

      <h2>現在のルーム</h2>

      <div id="roomList">

        <div class="empty">
          ルームを読み込んでいます...
        </div>

      </div>


      <button
        class="backButton"
        onclick="showMenu()"
      >
        戻る
      </button>

    </div>

  </div>


  <!-- ================= -->
  <!-- チャット -->
  <!-- ================= -->

  <div id="chatArea">

    <div class="card">

      <div id="roomTitle"></div>
      <div id="roomPresence">参加者の状態を読み込んでいます...</div>

      <button id="roomSettingsToggle" type="button" onclick="toggleRoomSettings()" style="display:none">
        ⚙️ ルーム設定
      </button>
      <div id="roomSettingsPanel">
        <h3>⚙️ ルーム設定</h3>
        <label>入室パスワード（空欄で解除）
          <input id="settingPassword" type="password" maxlength="32" placeholder="パスワードを設定">
        </label>
        <label><input id="settingProfanity" type="checkbox"> 暴言フィルターを有効にする</label>
        <label><input id="settingSexual" type="checkbox"> 下ネタ・性的表現フィルターを有効にする</label>
        <label>何回警告したら追放する？
          <select id="settingMaxWarnings">
            <option value="1">1回（すぐ追放）</option>
            <option value="2">2回</option>
            <option value="3" selected>3回</option>
            <option value="5">5回</option>
          </select>
        </label>
        <button type="button" onclick="saveRoomSettings()">設定を保存</button>
        <div id="roomSettingsStatus" class="error"></div>
      </div>

      <section id="moderationVoteBoard">
        <h3>⚖️ ルーム管理投票</h3>
        <div class="voteNotice">オーナーはチャット欄で「/vote ユーザー名」と入力すると投票を開始できます。</div>
        <div id="moderationVoteContent" class="voteNotice">進行中の投票はありません</div>
      </section>

      <section id="announcementBoard">
        <h3>📢 お知らせ</h3>
        <div id="announcementList">
          <div class="empty">お知らせを読み込んでいます...</div>
        </div>
        <div id="announcementComposer">
          <h4 id="announcementFormTitle">お知らせを投稿</h4>
          <textarea id="announcementText" maxlength="500" placeholder="みんなに伝えたいことを入力（500文字以内）"></textarea>
          <button type="button" onclick="saveAnnouncement()">投稿する</button>
          <button type="button" class="backButton" onclick="cancelAnnouncementEdit()">キャンセル</button>
          <div id="announcementStatus" class="error"></div>
        </div>
        <button id="announcementNewButton" type="button" onclick="startNewAnnouncement()" style="display:none">
          ＋ お知らせを投稿
        </button>
      </section>

      <div id="messages"></div>


      <div id="replyBar"><span id="replyBarText"></span><button type="button" onclick="cancelReply()">返信をやめる</button></div>

      <input
        id="messageInput"
        type="text"
        placeholder="メッセージを入力"
      >

      <button id="sendButton">
        送信
      </button>

    </div>

  </div>


</div>


<script src="/socket.io/socket.io.js"></script>


<script>


  // Socket.IO
  const socket = io();


  // 現在のユーザー名
  let username = "";


  // 現在いるルーム
  let currentRoom = "";
  let isRoomOwner = false;
  let editingAnnouncementId = "";
  let currentReplyTo = null;

  // ブラウザ通知の許可状態を画面に反映
  function updateNotificationButton() {
    const button = document.getElementById("notificationPermissionButton");
    const status = document.getElementById("notificationStatus");
    if (!("Notification" in window)) {
      button.textContent = "このブラウザは通知に対応していません";
      button.disabled = true;
      status.textContent = "";
      return;
    }
    if (Notification.permission === "granted") {
      button.textContent = "🔔 通知は有効です";
      button.disabled = true;
      status.textContent = "別のタブを見ているときに通知します。";
    } else if (Notification.permission === "denied") {
      button.textContent = "通知がブロックされています";
      button.disabled = true;
      status.textContent = "ブラウザのサイト設定から通知を許可してください。";
    } else {
      button.textContent = "🔔 通知を有効にする";
      button.disabled = false;
      status.textContent = "ボタンを押して通知を許可してください。";
    }
  }

  // ボタンを押したときだけ通知許可をリクエストする
  async function enableNotifications() {
    if (!("Notification" in window)) {
      updateNotificationButton();
      return;
    }
    try {
      await Notification.requestPermission();
    } catch (error) {
      console.error("通知の許可を取得できませんでした", error);
    }
    updateNotificationButton();
  }

  // 別タブを見ているときだけデスクトップ通知を表示する
  function showDesktopNotification(sender) {
    if (!("Notification" in window)) return;
    if (Notification.permission !== "granted") return;
    if (!document.hidden) return;
    const roomLabel = currentRoom ? "「" + currentRoom + "」" : "チャット";
    const notification = new Notification("チャッツイヨ", {
      body: sender + "さんから" + roomLabel + "にメッセージが届きました。",
      tag: "chatshiyo-" + currentRoom + "-" + Date.now()
    });
    notification.onclick = () => {
      window.focus();
      notification.close();
    };
  }

  updateNotificationButton();


  // =========================
  // ユーザー名
  // =========================

  function setUsername() {

    const input =
      document.getElementById("username");

    username =
      input.value.trim();


    if (!username) {

      document.getElementById(
        "nameError"
      ).textContent =
        "ユーザー名を入力してください";

      return;

    }


    document.getElementById(
      "nameError"
    ).textContent = "";

    // ルーム一覧を開く前に、サーバー側にもユーザー名を登録する
    socket.emit("setUsername", username);

    document.getElementById(
      "welcome"
    ).textContent =
      username + "さん、こんにちは！";


    showMenu();

  }


  // =========================
  // 画面切り替え
  // =========================

  function hideAll() {

    document.getElementById(
      "nameArea"
    ).style.display = "none";

    document.getElementById(
      "menuArea"
    ).style.display = "none";

    document.getElementById(
      "createArea"
    ).style.display = "none";

    document.getElementById(
      "roomsArea"
    ).style.display = "none";

    document.getElementById(
      "chatArea"
    ).style.display = "none";

  }


  function showMenu() {

    hideAll();

    document.getElementById(
      "menuArea"
    ).style.display = "block";

  }


  function showCreate() {

    hideAll();

    document.getElementById(
      "createArea"
    ).style.display = "block";

    document.getElementById(
      "createRoomName"
    ).focus();

  }


  // =========================
  // ルーム一覧
  // =========================

  function showRooms() {

    hideAll();

    document.getElementById(
      "roomsArea"
    ).style.display = "block";


    socket.emit("getRooms");

  }


  // =========================
  // ルームを作る
  // =========================

  function createRoom() {

    const roomName =
      document.getElementById(
        "createRoomName"
      ).value.trim();


    if (!roomName) {

      document.getElementById(
        "createError"
      ).textContent =
        "ルーム名を入力してください";

      return;

    }


    document.getElementById(
      "createError"
    ).textContent = "";


    socket.emit(
      "createRoom",
      roomName
    );

  }


  // =========================
  // ルーム作成成功
  // =========================

  socket.on(
    "roomCreated",
    (room) => {

      joinRoom(room);

    }
  );


  // =========================
  // ルームに入る
  // =========================

  function joinRoom(room, password = "") {
    socket.emit("joinRoom", {
      username: username,
      room: room,
      password: password
    });
  }

  function toggleRoomSettings() {
    const panel = document.getElementById("roomSettingsPanel");
    panel.style.display = panel.style.display === "block" ? "none" : "block";
  }

  function saveRoomSettings() {
    document.getElementById("roomSettingsStatus").textContent = "";
    socket.emit("setRoomSettings", {
      password: document.getElementById("settingPassword").value,
      profanityFilter: document.getElementById("settingProfanity").checked,
      sexualFilter: document.getElementById("settingSexual").checked,
      maxWarnings: Number(document.getElementById("settingMaxWarnings").value)
    });
  }


  // =========================
  // ルーム一覧を受信
  // =========================

  socket.on(
    "roomList",
    (rooms) => {

      const list =
        document.getElementById(
          "roomList"
        );


      list.innerHTML = "";


      if (rooms.length === 0) {

        list.innerHTML = `
          <div class="empty">
            現在ルームはありません
          </div>
        `;

        return;

      }


      rooms.forEach(
        (room) => {

          const div =
            document.createElement(
              "div"
            );


          div.className = "room";


          const users =
            room.users
              .map(
                user =>
                  `<div>👤 ${escapeHtml(user)}</div>`
              )
              .join("");


          div.innerHTML = `

            <div class="roomName">
              💬 ${escapeHtml(room.name)}
            </div>

            ${room.hasPassword ? '<div class="roomLock">🔒 パスワードが必要</div>' : ''}

            <div class="roomCount">
              参加者：${room.count}人
            </div>

            <div class="users">
              ${users}
            </div>

            <button
              onclick="joinRoom('${escapeAttribute(room.name)}')"
            >
              このルームに入る
            </button>

            ${username === "たい焼き" ? `
              <button class="deleteRoomButton" type="button"
                onclick="deleteRoom('${escapeAttribute(room.name)}')">
                このルームを削除
              </button>
            ` : ''}

          `;


          list.appendChild(div);

        }
      );

    }
  );


  function deleteRoom(roomName) {
    if (username !== "たい焼き") {
      alert("権限がありません");
      return;
    }
    if (confirm("「" + roomName + "」を削除しますか？\\n参加者全員が退出し、ルーム内のデータも消えます。この操作は取り消せません。")) {
      socket.emit("deleteRoom", { roomName, username });
    }
  }

  socket.on("deleteRoomSuccess", (roomName) => {
    alert("「" + roomName + "」を削除しました");
  });

  socket.on("deleteRoomError", (message) => {
    alert(message);
  });

  socket.on("roomDeleted", (data) => {
    if (currentRoom === data.room) {
      currentRoom = "";
      showMenu();
      alert(data.message);
    }
  });

  // =========================
  // 入室成功
  // =========================

  socket.on(
    "roomJoined",
    (room) => {

      currentRoom = room;


      hideAll();


      document.getElementById(
        "chatArea"
      ).style.display = "block";


      document.getElementById(
        "roomTitle"
      ).textContent =
        "💬 " + room;


      document.getElementById(
        "messageInput"
      ).focus();

      document.getElementById("roomSettingsPanel").style.display = "none";
      document.getElementById("roomSettingsToggle").style.display = "none";
      socket.emit("getRoomSettings");
      socket.emit("getAnnouncements");
      socket.emit("getModerationVote");
      socket.emit("presenceUpdate", getPresenceStatus());
      cancelReply();
      cancelAnnouncementEdit();

    }
  );


  socket.on("passwordRequired", (room) => {
    const password = prompt("このルームのパスワードを入力してください");
    if (password === null) return;
    joinRoom(room, password);
  });

  socket.on("roomSettingsData", (data) => {
    isRoomOwner = Boolean(data.isOwner);
    document.getElementById("roomSettingsToggle").style.display = data.isOwner ? "block" : "none";
    document.getElementById("announcementNewButton").style.display = isRoomOwner ? "block" : "none";
    if (!data.isOwner) return;
    document.getElementById("settingPassword").value = "";
    document.getElementById("settingPassword").placeholder =
      data.passwordEnabled ? "設定済み（変更または空欄で解除）" : "パスワードを設定";
    document.getElementById("settingProfanity").checked = data.profanityFilter;
    document.getElementById("settingSexual").checked = data.sexualFilter;
    document.getElementById("settingMaxWarnings").value = String(data.maxWarnings);
  });

  socket.on("roomPresence", (users) => {
    const panel = document.getElementById("roomPresence");
    panel.replaceChildren();
    const heading = document.createElement("strong");
    heading.textContent = "参加者：";
    panel.appendChild(heading);
    (users || []).forEach((user) => {
      const item = document.createElement("span");
      item.className = "presenceUser";
      item.textContent = (user.status === "away" ? "🌙 " : "🟢 ") + user.username +
        (user.status === "away" ? "（離席中）" : "（オンライン）");
      panel.appendChild(item);
    });
  });

  function getPresenceStatus() {
    return document.hidden || !document.hasFocus() ? "away" : "online";
  }

  function updatePresence() {
    if (currentRoom) socket.emit("presenceUpdate", getPresenceStatus());
    if (!document.hidden && document.hasFocus() && currentRoom) {
      document.querySelectorAll(".message[data-message-id]").forEach((item) => {
        if (item.dataset.own !== "true" && item.dataset.readMarked !== "true") {
          item.dataset.readMarked = "true";
          socket.emit("markMessageRead", item.dataset.messageId);
        }
      });
    }
  }

  document.addEventListener("visibilitychange", updatePresence);
  window.addEventListener("focus", updatePresence);
  window.addEventListener("blur", updatePresence);

  socket.on("messageReadCount", (data) => {
    const message = document.querySelector('.message[data-message-id="' + CSS.escape(data.messageId) + '"]');
    if (!message) return;
    const read = message.querySelector(".readCount");
    if (read) read.textContent = "既読 " + data.readCount + "人";
  });

  socket.on("moderationVoteChanged", () => {
    socket.emit("getModerationVote");
  });

  socket.on("moderationVoteData", (data) => {
    renderModerationVote(data);
  });

  socket.on("moderationVoteError", (message) => {
    alert(message);
  });

  socket.on("moderationVoteCancelled", (message) => {
    alert(message);
    socket.emit("getModerationVote");
  });

  socket.on("moderationVoteResult", (data) => {
    const labels = {
      ban: "賛成が過半数のため、追放になりました。",
      safe: "反対が過半数のため、今回は追放・厳重注意なしです。",
      warning: "厳重注意が過半数でした。厳重注意 " + data.warningCount + "/3 回目です。",
      ban_after_warnings: "厳重注意が3回に達したため、追放になりました。",
      no_majority: "過半数に達した選択肢がないため、判定保留です。"
    };
    alert(data.targetName + "さんの投票結果：\n" + (labels[data.outcome] || "投票が終了しました"));
    socket.emit("getModerationVote");
  });

  function castModerationVote(choice) {
    socket.emit("castModerationVote", choice);
  }

  function closeModerationVote() {
    if (confirm("現在の投票を終了して結果を確定しますか？")) {
      socket.emit("closeModerationVote");
    }
  }

  function renderModerationVote(data) {
    const content = document.getElementById("moderationVoteContent");
    if (!data) {
      content.textContent = "進行中の投票はありません";
      return;
    }
    content.replaceChildren();
    const heading = document.createElement("strong");
    heading.textContent = "「" + data.targetName + "」さんについて投票中";
    content.appendChild(heading);

    const counts = document.createElement("div");
    counts.className = "voteCounts";
    counts.textContent =
      "賛成：" + data.counts.support + "票 ／ 反対：" + data.counts.oppose +
      "票 ／ 厳重注意：" + data.counts.warning + "票";
    content.appendChild(counts);

    const progress = document.createElement("div");
    progress.className = "voteNotice";
    progress.textContent = "投票済み " + data.votedCount + " / " + data.eligibleCount +
      "人（対象者本人は投票できません）";
    content.appendChild(progress);

    if (data.canVote) {
      const note = document.createElement("div");
      note.className = "voteNotice";
      note.textContent = "あなたの意見を1つ選んでください。投票後の変更はできません。";
      content.appendChild(note);
      [
        ["support", "賛成（追放）"],
        ["oppose", "反対（追放しない）"],
        ["warning", "厳重注意"]
      ].forEach(([value, label]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "voteChoiceButton";
        button.textContent = label;
        button.addEventListener("click", () => castModerationVote(value));
        content.appendChild(button);
      });
    } else if (data.hasVoted) {
      const note = document.createElement("div");
      note.className = "voteNotice";
      note.textContent = "投票済みです。結果が確定するまでお待ちください。";
      content.appendChild(note);
    } else {
      const note = document.createElement("div");
      note.className = "voteNotice";
      note.textContent = "この投票には参加できません。";
      content.appendChild(note);
    }

    if (data.isOwner) {
      const close = document.createElement("button");
      close.type = "button";
      close.className = "backButton";
      close.textContent = data.votedCount < data.eligibleCount
        ? "全員の投票待ち (" + data.votedCount + "/" + data.eligibleCount + ")"
        : "投票を終了して結果を確定";
      close.disabled = data.votedCount < data.eligibleCount;
      close.addEventListener("click", closeModerationVote);
      content.appendChild(close);
    }
  }

  socket.on("announcementOwnerChanged", (isOwner) => {
    isRoomOwner = Boolean(isOwner);
    document.getElementById("announcementNewButton").style.display = isRoomOwner ? "block" : "none";
    if (!isRoomOwner) cancelAnnouncementEdit();
  });

  socket.on("announcementData", (data) => {
    isRoomOwner = Boolean(data.isOwner);
    document.getElementById("announcementNewButton").style.display = isRoomOwner ? "block" : "none";
    renderAnnouncements(data.announcements || []);
  });

  socket.on("announcementsChanged", (announcements) => {
    renderAnnouncements(announcements || []);
  });

  socket.on("announcementSaved", () => {
    cancelAnnouncementEdit();
    document.getElementById("announcementStatus").textContent = "保存しました！";
  });

  socket.on("announcementError", (message) => {
    document.getElementById("announcementStatus").textContent = message;
  });

  socket.on("newAnnouncement", (item) => {
    if (item.author !== username && document.hidden && "Notification" in window && Notification.permission === "granted") {
      const notification = new Notification("チャッツイヨ：新しいお知らせ", {
        body: "「" + currentRoom + "」にお知らせが投稿されました。",
        tag: "chatshiyo-announcement-" + item.id
      });
      notification.onclick = () => {
        window.focus();
        notification.close();
      };
    }
  });

  function renderAnnouncements(items) {
    const list = document.getElementById("announcementList");
    list.replaceChildren();
    if (!items.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "まだお知らせはありません";
      list.appendChild(empty);
      return;
    }
    items.forEach((item) => {
      const card = document.createElement("article");
      card.className = "announcementCard";

      const meta = document.createElement("div");
      meta.className = "announcementMeta";
      const date = new Date(item.updatedAt || item.createdAt);
      meta.textContent = "📌 " + item.author + " ・ " + date.toLocaleString("ja-JP") +
        (item.updatedAt ? "（編集済み）" : "");
      card.appendChild(meta);

      const body = document.createElement("div");
      body.className = "announcementBody";
      body.textContent = item.text;
      card.appendChild(body);

      if (isRoomOwner) {
        const actions = document.createElement("div");
        actions.className = "announcementActions";
        const edit = document.createElement("button");
        edit.type = "button";
        edit.textContent = "編集";
        edit.addEventListener("click", () => editAnnouncement(item));
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "削除";
        remove.addEventListener("click", () => {
          if (confirm("このお知らせを削除しますか？")) {
            socket.emit("deleteAnnouncement", item.id);
          }
        });
        actions.append(edit, remove);
        card.appendChild(actions);
      }
      list.appendChild(card);
    });
  }

  function startNewAnnouncement() {
    editingAnnouncementId = "";
    document.getElementById("announcementFormTitle").textContent = "お知らせを投稿";
    document.getElementById("announcementText").value = "";
    document.getElementById("announcementStatus").textContent = "";
    document.getElementById("announcementComposer").style.display = "block";
    document.getElementById("announcementText").focus();
  }

  function editAnnouncement(item) {
    editingAnnouncementId = item.id;
    document.getElementById("announcementFormTitle").textContent = "お知らせを編集";
    document.getElementById("announcementText").value = item.text;
    document.getElementById("announcementStatus").textContent = "";
    document.getElementById("announcementComposer").style.display = "block";
    document.getElementById("announcementText").focus();
  }

  function cancelAnnouncementEdit() {
    editingAnnouncementId = "";
    const composer = document.getElementById("announcementComposer");
    if (composer) composer.style.display = "none";
    const input = document.getElementById("announcementText");
    if (input) input.value = "";
  }

  function saveAnnouncement() {
    const text = document.getElementById("announcementText").value.trim();
    document.getElementById("announcementStatus").textContent = "";
    if (!text) {
      document.getElementById("announcementStatus").textContent = "お知らせの内容を入力してください";
      return;
    }
    socket.emit("postAnnouncement", { id: editingAnnouncementId, text });
  }

  socket.on("roomSettingsSaved", (data) => {
    document.getElementById("settingPassword").value = "";
    document.getElementById("settingPassword").placeholder =
      data.passwordEnabled ? "設定済み（変更または空欄で解除）" : "パスワードを設定";
    document.getElementById("roomSettingsStatus").textContent = "保存しました！";
  });

  socket.on("roomSettingsError", (message) => {
    document.getElementById("roomSettingsStatus").textContent = message;
  });

  socket.on("moderationWarning", (data) => {
    alert(data.category + "が検知されました。警告 " + data.count + "/" + data.maxWarnings + " 回目です。");
  });

  // 退去されたとき
  socket.on("kicked", (data) => {
    currentRoom = "";
    alert(data.message);
    showMenu();
  });

  // 退去コマンドのエラー
  socket.on("kickError", (message) => {
    alert(message);
  });

  // =========================
  // エラー
  // =========================

  socket.on(
    "roomError",
    (message) => {

      alert(message);

    }
  );


  // =========================
  // システムメッセージ
  // =========================

  socket.on(
    "systemMessage",
    (data) => {

      addSystemMessage(
        data.message
      );

    }
  );


  // =========================
  // チャット
  // =========================

  socket.on(
    "chatMessage",
    (data) => {
      addMessage(data.username, data.message, data);
      if (data.username !== username) {
        if (!document.hidden && document.hasFocus() && data.id) socket.emit("markMessageRead", data.id);
        showDesktopNotification(data.username);
      }
    }
  );


  // 匿名メッセージを受信
  socket.on("anonymousMessage", (data) => {
    addMessage(data.username, data.message);
    if (data.username !== username) {
      showDesktopNotification(data.username);
    }
  });

  // 匿名メッセージの送信エラー
  socket.on("anonymousError", (message) => {
    alert(message);
  });


  function addMessage(name, message, meta = {}) {
    const messages = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "message";
    if (meta.id) {
      div.dataset.messageId = meta.id;
      div.dataset.own = String(name === username);
    }

    if (meta.replyTo) {
      const quote = document.createElement("div");
      quote.className = "messageReply";
      quote.textContent = "↪ " + meta.replyTo.username + "：" + meta.replyTo.message;
      div.appendChild(quote);
    }

    const body = document.createElement("div");
    body.className = "messageText";
    body.textContent = name + "： " + message;
    div.appendChild(body);

    if (meta.id) {
      const tools = document.createElement("div");
      tools.className = "messageTools";
      const read = document.createElement("span");
      read.className = "readCount";
      read.textContent = "既読 0人";
      tools.appendChild(read);
      const reply = document.createElement("button");
      reply.type = "button";
      reply.textContent = "返信";
      reply.addEventListener("click", () => setReply(meta.id, name, message));
      tools.appendChild(reply);
      div.appendChild(tools);
    }

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function setReply(id, name, message) {
    currentReplyTo = { id, username: name, message };
    document.getElementById("replyBarText").textContent = "「" + name + "」への返信：" + message.slice(0, 80);
    document.getElementById("replyBar").style.display = "block";
    document.getElementById("messageInput").focus();
  }

  function cancelReply() {
    currentReplyTo = null;
    const bar = document.getElementById("replyBar");
    if (bar) bar.style.display = "none";
  }


  function addSystemMessage(
    message
  ) {

    const messages =
      document.getElementById(
        "messages"
      );


    const div =
      document.createElement(
        "div"
      );


    div.className =
      "system";


    div.textContent =
      message;


    messages.appendChild(div);


    messages.scrollTop =
      messages.scrollHeight;

  }


  // =========================
  // メッセージ送信
  // =========================

  function sendMessage() {

    const input =
      document.getElementById(
        "messageInput"
      );


    const message =
      input.value.trim();


    if (!message) {
      return;
    }

    // /vote ユーザー名 で、ルームオーナーが管理投票を開始
    if (/^\/vote(?:\s|$)/i.test(message)) {
      const targetName = message.slice(5).trim();
      if (!targetName) {
        alert("使い方：/vote ユーザー名");
        return;
      }
      socket.emit("startModerationVote", targetName);
      input.value = "";
      input.focus();
      return;
    }

    socket.emit("chatMessage", {
      message,
      replyToId: currentReplyTo ? currentReplyTo.id : ""
    });
    cancelReply();


    input.value = "";


    input.focus();

  }


  document
    .getElementById(
      "sendButton"
    )
    .addEventListener(
      "click",
      sendMessage
    );


  document
    .getElementById(
      "messageInput"
    )
    .addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter"
        ) {

          sendMessage();

        }

      }
    );


  // =========================
  // HTMLエスケープ
  // =========================

  function escapeHtml(text) {

    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(text) {

    return text
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");

  }

</script>


</body>

</html>
